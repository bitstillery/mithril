<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Preview</title>
        <style>
            body {
                margin: 0;
                padding: 12px;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                background: #282c34;
                color: #abb2bf;
            }
            .animate-in {
                animation: slide-in 0.4s ease-out;
            }
            .animate-out {
                animation: slide-out 0.4s ease-in;
            }
            @keyframes slide-in {
                from {
                    opacity: 0;
                    transform: translateY(-12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes slide-out {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(-12px);
                }
            }
        </style>
    </head>
    <body>
        <div id="preview-root"></div>
        <script type="module" src="/preview-bundle.js"></script>
    </body>
</html>
